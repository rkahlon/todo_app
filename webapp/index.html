<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Todo App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #7c4df0;
    --purple-dark: #6a3ce0;
    --red: #e0523f;
    --row-bg: #eef0f4;
    --card-bg: #ffffff;
    --text: #23232b;
    --muted: #8b8fa3;
    --border: #e3e5ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    font-family: 'Baloo 2', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #6be8c4 0%, #6cbfe0 45%, #4f7fe4 100%);
    color: var(--text);
  }
  main {
    width: 100%;
    max-width: 440px;
    background: var(--card-bg);
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 20px 50px rgba(20, 30, 60, 0.25);
  }
  h1 {
    font-size: 28px;
    font-weight: 800;
    margin: 0 0 20px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .header-row h1 { margin: 0; }
  form {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    font-family: inherit;
    font-size: 15px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
  }
  input[type="text"]::placeholder { color: var(--muted); }
  input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 0 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    color: var(--muted);
    width: 118px;
  }
  input:focus { outline: 2px solid var(--purple); outline-offset: 1px; }
  button {
    cursor: pointer;
    border: none;
    font-family: inherit;
  }
  .add-btn {
    flex-shrink: 0;
    width: 48px;
    background: var(--purple);
    color: #fff;
    border-radius: 10px;
    font-size: 22px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .add-btn:hover { background: var(--purple-dark); }
  ul {
    list-style: none;
    margin: 0 0 20px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 340px;
    overflow-y: auto;
  }
  li {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--row-bg);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .task-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    cursor: pointer;
  }
  .task-text {
    font-size: 15px;
    word-break: break-word;
  }
  li.done .task-text {
    text-decoration: line-through;
    color: var(--muted);
  }
  .task-due {
    font-size: 12px;
    color: var(--muted);
  }
  .task-due.overdue { color: var(--red); font-weight: 600; }
  .remove {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--red);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
  }
  li:hover .remove {
    opacity: 1;
    pointer-events: auto;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 20px 0;
    font-size: 14px;
  }
  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  footer p {
    margin: 0;
    font-size: 14px;
    color: var(--muted);
  }
  .clear-btn {
    background: var(--purple);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    padding: 10px 18px;
    border-radius: 10px;
  }
  .clear-btn:hover { background: var(--purple-dark); }
  .clear-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .signin-view {
    text-align: center;
    padding: 20px 0 4px;
  }
  .signin-view p {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 20px;
  }
  .google-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: 600;
  }
  .google-btn:hover { background: #f7f7f9; }
  .signout-btn {
    background: none;
    color: var(--muted);
    font-size: 13px;
    text-decoration: underline;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="signin-view" class="signin-view">
    <h1>Todo App</h1>
    <p>Sign in to sync your tasks across devices.</p>
    <button id="signin-btn" class="google-btn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.85 2.09-1.81 2.73v2.27h2.92c1.71-1.57 2.69-3.88 2.69-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.27c-.81.54-1.85.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.97v2.34C2.45 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.7A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.17.29-1.7V4.96H.97A9 9 0 0 0 0 9c0 1.45.35 2.83.97 4.04l3-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.47.89 11.43 0 9 0 5.48 0 2.45 2.02.97 4.96l3 2.34C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
      Sign in with Google
    </button>
  </section>

  <section id="app-view" hidden>
    <div class="header-row">
      <h1>Todo App</h1>
      <button id="signout-btn" class="signout-btn">Sign out</button>
    </div>
    <form id="add-form">
      <input type="text" id="text-input" placeholder="Add your new todo" required>
      <input type="date" id="due-input">
      <button type="submit" class="add-btn" aria-label="Add task">+</button>
    </form>
    <ul id="task-list"></ul>
    <footer>
      <p id="pending-count">You have 0 pending tasks</p>
      <button id="clear-btn" class="clear-btn">Clear All</button>
    </footer>
  </section>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, updateDoc, deleteDoc, doc,
    onSnapshot, query, orderBy, serverTimestamp, writeBatch, getDocs,
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const firebaseConfig = {
    projectId: "todo-app-b2652",
    appId: "1:367611705947:web:6709e4e64fd6d244049d7e",
    storageBucket: "todo-app-b2652.firebasestorage.app",
    apiKey: "AIzaSyC5ZecbheIIaS31-nHp4SAyYU1ulZgsxsM",
    authDomain: "todo-app-b2652.firebaseapp.com",
    messagingSenderId: "367611705947",
    measurementId: "G-YDSCKCS1H8",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  const signinView = document.getElementById('signin-view');
  const appView = document.getElementById('app-view');
  const signinBtn = document.getElementById('signin-btn');
  const signoutBtn = document.getElementById('signout-btn');
  const list = document.getElementById('task-list');
  const form = document.getElementById('add-form');
  const textInput = document.getElementById('text-input');
  const dueInput = document.getElementById('due-input');
  const pendingCount = document.getElementById('pending-count');
  const clearBtn = document.getElementById('clear-btn');
  const today = new Date().toISOString().slice(0, 10);

  let unsubscribeTasks = null;

  signinBtn.addEventListener('click', () => {
    signInWithPopup(auth, provider).catch((err) => alert(err.message));
  });

  signoutBtn.addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    if (unsubscribeTasks) { unsubscribeTasks(); unsubscribeTasks = null; }

    if (user) {
      signinView.hidden = true;
      appView.hidden = false;
      const tasksRef = collection(db, 'users', user.uid, 'tasks');
      const q = query(tasksRef, orderBy('createdAt', 'asc'));
      unsubscribeTasks = onSnapshot(q, (snapshot) => {
        const tasks = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
        render(tasks, user.uid);
      });
    } else {
      signinView.hidden = false;
      appView.hidden = true;
      list.innerHTML = '';
    }
  });

  function render(tasks, uid) {
    list.innerHTML = '';

    if (tasks.length === 0) {
      const empty = document.createElement('li');
      empty.className = 'empty';
      empty.style.background = 'none';
      empty.textContent = 'No tasks. Add one above!';
      list.appendChild(empty);
    }

    for (const task of tasks) {
      const li = document.createElement('li');
      if (task.done) li.classList.add('done');

      const main = document.createElement('div');
      main.className = 'task-main';
      main.title = task.done ? '' : 'Click to mark as done';
      if (!task.done) main.addEventListener('click', () => markDone(uid, task.id));

      const text = document.createElement('span');
      text.className = 'task-text';
      text.textContent = task.text;
      main.appendChild(text);

      if (task.due) {
        const due = document.createElement('span');
        due.className = 'task-due';
        if (!task.done && task.due < today) due.classList.add('overdue');
        due.textContent = `Due ${task.due}`;
        main.appendChild(due);
      }

      li.appendChild(main);

      const remove = document.createElement('button');
      remove.className = 'remove';
      remove.innerHTML = '&#128465;';
      remove.title = 'Remove';
      remove.addEventListener('click', () => removeTask(uid, task.id));
      li.appendChild(remove);

      list.appendChild(li);
    }

    const pending = tasks.filter((t) => !t.done).length;
    pendingCount.textContent = `You have ${pending} pending task${pending === 1 ? '' : 's'}`;
    clearBtn.disabled = tasks.length === 0;
  }

  async function markDone(uid, taskId) {
    await updateDoc(doc(db, 'users', uid, 'tasks', taskId), { done: true });
  }

  async function removeTask(uid, taskId) {
    await deleteDoc(doc(db, 'users', uid, 'tasks', taskId));
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const user = auth.currentUser;
    if (!user) return;
    const text = textInput.value.trim();
    if (!text) return;
    await addDoc(collection(db, 'users', user.uid, 'tasks'), {
      text,
      done: false,
      due: dueInput.value || null,
      createdAt: serverTimestamp(),
    });
    textInput.value = '';
    dueInput.value = '';
    textInput.focus();
  });

  clearBtn.addEventListener('click', async () => {
    const user = auth.currentUser;
    if (!user) return;
    if (!confirm('Clear all tasks? This cannot be undone.')) return;
    const tasksRef = collection(db, 'users', user.uid, 'tasks');
    const snapshot = await getDocs(tasksRef);
    const batch = writeBatch(db);
    snapshot.docs.forEach((d) => batch.delete(d.ref));
    await batch.commit();
  });
</script>
</body>
</html>
